name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: true
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -backend=false -plugin-dir=.terraform/plugins
        env:
          TF_PLUGIN_CACHE_DIR: ""

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Validate (examples/master)
        run: |
          cd examples/master
          terraform init -backend=false -plugin-dir=.terraform/plugins
          terraform validate

      - name: Terraform Validate (examples/worker)
        run: |
          cd examples/worker
          terraform init -backend=false -plugin-dir=.terraform/plugins
          terraform validate

      - name: Check docs
        run: |
          if command -v terraform-docs &> /dev/null; then
            terraform-docs markdown table --output-file README.md --output-mode inject .
          else
            echo "terraform-docs not installed, skipping docs generation"
          fi

  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          sudo mv terraform-docs /usr/local/bin/

      - name: Generate docs
        run: |
          terraform-docs markdown table --output-file README.md --output-mode inject .
          terraform-docs markdown table --output-file examples/master/README.md --output-mode inject examples/master
          terraform-docs markdown table --output-file examples/worker/README.md --output-mode inject examples/worker

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md examples/master/README.md examples/worker/README.md
          git diff --staged --quiet || git commit -m "docs: update terraform-docs"
          git push